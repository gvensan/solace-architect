# Audience packs for the Export Report dashboard.
#
# The "blueprint" pack (id: blueprint) is the Comprehensive Report — every skill,
# every artifact, every decision and finding. The other packs filter that
# comprehensive content into a focused subset for a specific audience. The
# dashboard reads this file via /api/report-packs and renders one tile per pack
# on the Export view (Comprehensive as the hero card; audience packs below).
#
# Pack fields:
#   id          — internal identifier (used in JS and URLs)
#   label       — display name on the tile and in the generated HTML report title
#   description — 1-line description on the tile
#   audience    — who this pack is for
#   filters:
#     dirs            — artifact directory names to include (e.g. "12-blueprint")
#                       all files under the directory are included
#     files           — explicit artifact paths to include (artifacts/-relative)
#     globs           — glob patterns matched against artifact paths
#     top_sections    — top-level inline sections to include in the report
#                       options: summary, scope, decisions, findings, open-items,
#                                connected-systems, artifacts
#                       omit the field entirely to include all sections
#     decision_skills — filter decisions table to decisions sourced from these skills
#                       empty list = hide decisions table entirely
#                       omit the field = show all decisions
#     finding_skills  — same as decision_skills, for the review findings table
#
# Blueprint pack uses an empty filters block — it includes everything.

version: 1

packs:
  - id: blueprint
    label: Comprehensive Report
    description: The full deliverable — every artifact, every decision, every review finding. Start here if you don't know which audience pack to pick.
    audience: Everyone — architects, engineers, ops, security, executives
    filters: {}

  - id: arch-blueprint
    label: System & Engineering View
    description: The 4+1 views plus the concrete specs an engineer builds from — topics, protocols, provisioning, and wiring diagrams.
    audience: Implementation team, engineering leads, new developers onboarding
    filters:
      dirs:
        - 15-arch-blueprint
        # The 4+1 views frame the system; the implementation team also needs the
        # concrete, buildable specs — the exact topics, protocols, and provisioning.
        - 02-topic-design
        - 05-protocol-select
      files:
        - 12-blueprint/config/broker/provisioning-parameters.md
      globs:
        # Physical / wiring diagrams so engineers see how it's deployed and connected.
        - "12-blueprint/diagrams/data-flow*.mermaid"
        - "12-blueprint/diagrams/broker-topology*.mermaid"
        - "12-blueprint/diagrams/dmr-topology*.mermaid"
        - "12-blueprint/diagrams/topic-hierarchy*.mermaid"
        - "12-blueprint/diagrams/queue-subscriptions*.mermaid"
      top_sections:
        - summary
        - scope
        - decisions
        - findings
        - open-items
        - artifacts

  - id: executive
    label: Strategic Executive View
    description: Business case, ROI, and recommendation in plain language.
    audience: CXO, business sponsors, investment committee
    filters:
      dirs:
        - 14-executive
      top_sections:
        - summary
        - scope
        - open-items
        - artifacts
      decision_skills: []
      finding_skills: []

  - id: ops
    label: Infrastructure & Operations View
    description: Provisioning, monitoring, runbooks — full operational depth.
    audience: Solace admin, SRE, on-call engineer
    filters:
      dirs:
        - 02-topic-design
        - 03-broker-select
        - 06-mesh-design
        - 07-ha-dr
      files:
        - 08-integration/micro-integration-map.md
        - 10-reviews/ops-review.md
        - 11-validation/validation-report.md
        - 12-blueprint/architecture.md
        - 12-blueprint/runbook.md
        - 12-blueprint/topic-taxonomy.md
        - 12-blueprint/validation-report.md
        - 12-blueprint/config/broker/provisioning-parameters.md
        # EP-provisioning artifacts only exist when /solace-ep-provision runs.
        # If provisioning was skipped at intake, the matcher silently drops these.
        - 13-event-portal/provisioned.yaml
        - 13-event-portal/provisioning-report.md
      globs:
        - "12-blueprint/diagrams/broker-topology*.mermaid"
        - "12-blueprint/diagrams/dmr-topology*.mermaid"
        - "12-blueprint/diagrams/dlq-flow*.mermaid"
        - "12-blueprint/diagrams/failure-modes*.mermaid"
        - "12-blueprint/diagrams/ha-*.mermaid"
        - "12-blueprint/diagrams/dr-*.mermaid"
        - "12-blueprint/diagrams/queue-subscriptions*.mermaid"
        - "12-blueprint/diagrams/queue-subscriptions-detail*.md"
      top_sections:
        - summary
        - scope
        - decisions
        - findings
        - open-items
        - connected-systems
        - artifacts
      decision_skills:
        - solace-broker-select
        - solace-topic-design
        - solace-ops-review
        - solace-validate
        - solace-mesh-design
        - solace-ha-dr
        - solace-ep-provision
      finding_skills:
        - solace-ops-review

  - id: security
    label: Security & Governance View
    description: Auth, ACLs, encryption, audit, PII — full security posture.
    audience: Security architect, compliance, infosec, audit
    filters:
      dirs:
        # Data residency and DR are core compliance concerns. The mesh design is
        # where selective DMR replication *enforces* EU residency, and HA/DR defines
        # RPO/RTO per data class — audit needs to see how, not just that it's claimed.
        - 06-mesh-design
        - 07-ha-dr
      files:
        - 03-broker-select/broker-recommendation.md
        - 05-protocol-select/protocol-map.md
        - 10-reviews/security-review.md
        - 11-validation/validation-report.md
        - 13-event-portal/event-portal-design.md
        # Live-tenant state from provisioning is a security artifact too:
        # security/audit needs to know what was actually created in the tenant.
        - 13-event-portal/provisioned.yaml
        - 13-event-portal/provisioning-report.md
      globs:
        - "02-topic-design/antipattern-report*.md"
        - "12-blueprint/diagrams/security-*.mermaid"
        - "12-blueprint/diagrams/security-*.md"
      top_sections:
        - summary
        - scope
        - decisions
        - findings
        - open-items
        - artifacts
      decision_skills:
        - solace-security-review
        - solace-event-portal
        - solace-ep-provision
        - solace-broker-select
        - solace-mesh-design
        - solace-ha-dr
      finding_skills:
        - solace-security-review

  - id: developer
    label: Application Developer View
    description: Topics, schemas, protocols, client patterns — build correct clients.
    audience: Application engineers, SRE writing client code
    filters:
      dirs:
        - 02-topic-design
        - 05-protocol-select
      files:
        - 08-integration/micro-integration-map.md
        - 10-reviews/dev-review.md
        - 13-event-portal/event-portal-design.md
        - 13-event-portal/provisioning-plan.md
        # EP-provisioning artifacts only exist when /solace-ep-provision runs.
        - 13-event-portal/provisioned.yaml
        - 13-event-portal/provisioning-report.md
      globs:
        - "12-blueprint/diagrams/data-flow*.mermaid"
        - "12-blueprint/diagrams/protocol-stack*.mermaid"
        - "12-blueprint/diagrams/topic-hierarchy*.mermaid"
        - "13-event-portal/asyncapi/*.yaml"
        - "13-event-portal/asyncapi/*.yml"
        - "13-event-portal/asyncapi/*.json"
      top_sections:
        - summary
        - scope
        - decisions
        - findings
        - open-items
        - connected-systems
        - artifacts
      decision_skills:
        - solace-topic-design
        - solace-protocol-select
        - solace-dev-review
        - solace-event-portal
        - solace-sam-design
        - solace-ep-provision
      finding_skills:
        - solace-dev-review
